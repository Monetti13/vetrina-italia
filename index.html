<style>/* required styles */

<style>.leaflet-cluster-anim .leaflet-marker-icon, .leaflet-cluster-anim .leaflet-marker-shadow {
	-webkit-transition: -webkit-transform 0.3s ease-out, opacity 0.3s ease-in;
	-moz-transition: -moz-transform 0.3s ease-out, opacity 0.3s ease-in;
	-o-transition: -o-transform 0.3s ease-out, opacity 0.3s ease-in;
	transition: transform 0.3s ease-out, opacity 0.3s ease-in;
}

.leaflet-cluster-spider-leg {
	/* stroke-dashoffset (duration and function) should match with leaflet-marker-icon transform in order to track it exactly */

	-moz-transition: -moz-stroke-dashoffset 0.3s ease-out, -moz-stroke-opacity 0.3s ease-in;
	-o-transition: -o-stroke-dashoffset 0.3s ease-out, -o-stroke-opacity 0.3s ease-in;

}

<style>
:root{
  --paper:#F3F5F1; --card:#FFFFFF; --ink:#17302E; --ink-2:#4A5F5B; --line:#D3DCD7;
  --bottle:#1E5B47; --bottle-2:#174837; --sea:#D6E2DF; --land:#FBFCF9; --land-on:#E3EEE8;
  --focus:#C9932B;
  --display:"Bricolage Grotesque", system-ui, sans-serif;
  --body:"Atkinson Hyperlegible", system-ui, sans-serif;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion: reduce){html{scroll-behavior:auto}*{transition:none!important;animation:none!important}}
body{margin:0;background:var(--paper);color:var(--ink);font:400 16px/1.55 var(--body);-webkit-font-smoothing:antialiased}
a{color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:4px}
.wrap{max-width:1320px;margin:0 auto;padding:0 24px}
h1,h2,h3{font-family:var(--display);letter-spacing:-0.02em;margin:0}
button,input,select,textarea{font:inherit;color:inherit}

/* header */
.top{position:sticky;top:0;z-index:1000;background:rgba(243,245,241,.92);backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:24px;height:64px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;font:800 20px var(--display);letter-spacing:-0.03em}
.brand svg{flex:none}
.top nav{display:flex;gap:4px;margin-left:auto}
.top nav a{text-decoration:none;padding:8px 12px;border-radius:8px;color:var(--ink-2);font-weight:700}
.top nav a:hover{background:#E6ECE8;color:var(--ink)}
.lang{display:flex;border:1px solid var(--line);border-radius:999px;padding:3px;background:var(--card)}
.lang button{border:0;background:none;padding:4px 10px;border-radius:999px;cursor:pointer;font-weight:700;font-size:14px;color:var(--ink-2)}
.lang button[aria-pressed="true"]{background:var(--ink);color:#fff}

/* hero */
.hero{padding:56px 0 36px}
.hero .wrap{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:48px;align-items:end}
.hero h1{font-size:clamp(38px,5.6vw,76px);line-height:.98;font-weight:800;max-width:15ch}
.hero p.lead{font-size:19px;color:var(--ink-2);max-width:52ch;margin:0 0 22px}
.cta{display:flex;flex-wrap:wrap;gap:12px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:12px;padding:13px 20px;font-weight:700;text-decoration:none;border:2px solid transparent;cursor:pointer;font-size:16px}
.btn.primary{background:var(--bottle);color:#fff}
.btn.primary:hover{background:var(--bottle-2)}
.btn.ghost{border-color:var(--ink);background:transparent}
.btn.ghost:hover{background:var(--ink);color:#fff}
.btn.small{padding:8px 14px;font-size:15px;border-radius:10px}
.facts{margin:22px 0 0;font-size:15px;color:var(--ink-2)}
.facts strong{color:var(--ink)}

/* explorer */
.explore{padding:8px 0 64px}
.toolbar{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;display:grid;grid-template-columns:minmax(220px,1.6fr) repeat(4,minmax(130px,1fr));gap:10px;align-items:end}
.field label{display:block;font-size:13px;font-weight:700;color:var(--ink-2);margin:0 0 4px}
.field input,.field select{width:100%;height:44px;border:1px solid var(--line);border-radius:10px;padding:0 12px;background:#FBFCFB}
.field input:focus,.field select:focus{border-color:var(--bottle);outline:none;box-shadow:0 0 0 3px rgba(30,91,71,.18)}
.search{position:relative}
.search svg{position:absolute;left:12px;bottom:13px;pointer-events:none;color:var(--ink-2)}
.search input{padding-left:38px}
.certs{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.certs .lbl{font-size:13px;font-weight:700;color:var(--ink-2);margin-right:4px}
.chip{border:1px solid var(--line);background:#FBFCFB;border-radius:999px;padding:6px 12px;font-size:14px;font-weight:700;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:#fff}
.reset{height:44px;border:0;background:none;text-decoration:underline;cursor:pointer;color:var(--ink-2);padding:0 6px}
.filters-toggle{display:none}
.count{margin-left:auto;font-size:15px;color:var(--ink-2)}
.count strong{color:var(--ink)}

.explore-grid{display:grid;grid-template-columns:420px minmax(0,1fr);grid-template-areas:"pav pav" "list map";gap:20px;margin-top:20px;align-items:start}
.pavwrap{grid-area:pav}.list{grid-area:list}.mapcol{grid-area:map}
.explore-grid:not(.has-list){grid-template-columns:minmax(0,1fr);grid-template-areas:"pav" "map"}
.explore-grid:not(.has-list) .list{display:none}
.pavh{font-size:24px;font-weight:800;margin:4px 0 12px}
.list{display:flex;flex-direction:column;gap:10px}
.mapcol{position:sticky;top:84px}
#map{height:calc(100vh - 110px);min-height:520px;max-height:860px;border-radius:18px;background:var(--sea);border:1px solid var(--line)}
.leaflet-container{font-family:var(--body);background:var(--sea)}
.legend{position:absolute;left:12px;bottom:12px;z-index:500;background:rgba(255,255,255,.94);border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:grid;grid-template-columns:repeat(2,auto);gap:4px 14px;font-size:13px}
.legend span{display:flex;align-items:center;gap:6px}
.legend i{width:10px;height:10px;border-radius:50%;background:var(--c);display:inline-block}

.stand{display:grid;grid-template-columns:64px minmax(0,1fr);gap:14px;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px;cursor:pointer;text-align:left;width:100%}
.stand:hover,.stand.active{border-color:var(--ink)}
.stand .thumb{width:64px;height:64px;border-radius:10px;background:var(--c);display:grid;place-items:center;color:#fff}
.stand h3{font-size:18px;line-height:1.2}
.stand .meta{font-size:14px;color:var(--ink-2);margin-top:2px}
.stand .tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.tag{font-size:12.5px;font-weight:700;border-radius:6px;padding:2px 7px;background:#EEF2EF;color:var(--ink)}
.tag.cert{background:#F4EAD2;color:#6B4E12}
.empty{background:var(--card);border:1px dashed var(--ink-2);border-radius:14px;padding:22px}
.empty h3{font-size:20px;margin-bottom:6px}

/* pins */
.pin{width:30px;height:30px;border-radius:50% 50% 50% 4px;transform:rotate(-45deg);background:var(--c);border:2px solid #fff;box-shadow:0 2px 6px rgba(23,48,46,.35);display:grid;place-items:center}
.pin b{transform:rotate(45deg);color:#fff;font:700 13px var(--display)}
.pin.on{outline:3px solid var(--ink);outline-offset:1px}
.cluster{width:40px;height:40px;border-radius:50%;background:var(--ink);color:#fff;display:grid;place-items:center;font:800 15px var(--display);border:3px solid #fff;box-shadow:0 2px 8px rgba(23,48,46,.35)}
.leaflet-popup-content-wrapper{border-radius:14px}
.leaflet-popup-content{margin:14px 16px;min-width:220px}
.pop h3{font-size:18px;margin:0 0 2px}
.pop p{margin:0 0 10px;color:var(--ink-2);font-size:14px}
.region-tip{background:var(--ink);color:#fff;border:0;border-radius:6px;font-weight:700}
.region-tip:before{display:none}

/* pavilions */
section.block{padding:72px 0;border-top:1px solid var(--line)}
.block h2{font-size:clamp(30px,3.6vw,46px);line-height:1.04;font-weight:800;max-width:22ch}
.block .intro{color:var(--ink-2);font-size:18px;max-width:60ch;margin:12px 0 32px}
.pavs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
.pav{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;cursor:pointer;text-align:left;display:flex;flex-direction:column;gap:10px;min-height:170px;position:relative;overflow:hidden}
.pav:hover{border-color:var(--ink)}
.pav[aria-pressed="true"]{border:2px solid var(--c);padding:17px;background:color-mix(in srgb,var(--c) 9%,#fff)}
.pav .ico{width:48px;height:48px;border-radius:12px;background:var(--c);color:#fff;display:grid;place-items:center}
.pav h3{font-size:22px}
.pav p{margin:0;font-size:14px;color:var(--ink-2)}
.pav .n{position:absolute;right:16px;top:14px;font:800 30px var(--display);color:var(--c)}

.steps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:28px;counter-reset:s;margin:0;padding:0;list-style:none}
.steps li{counter-increment:s;border-top:3px solid var(--ink);padding-top:16px}
.steps li:before{content:counter(s);font:800 44px/1 var(--display);color:var(--bottle);display:block;margin-bottom:10px}
.steps h3{font-size:21px;margin-bottom:6px}
.steps p{margin:0;color:var(--ink-2)}

.exhibit{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:48px;align-items:start}
.benefits{list-style:none;padding:0;margin:28px 0 0;display:grid;gap:18px}
.benefits li{display:grid;grid-template-columns:28px 1fr;gap:12px}
.benefits svg{color:var(--bottle);margin-top:2px}
.benefits strong{display:block;font-size:18px}
.benefits span{color:var(--ink-2)}
form.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:24px;display:grid;gap:14px}
form.card h3{font-size:24px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.field textarea{width:100%;min-height:96px;border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:#FBFCFB;resize:vertical}
.field .err{color:#9B1C1C;font-size:13px;margin-top:4px;display:none}
.field.bad input,.field.bad select{border-color:#9B1C1C}
.field.bad .err{display:block}
.ok{background:#E3EEE8;border:1px solid #B8D3C6;border-radius:14px;padding:18px}
.ok h3{font-size:20px;margin-bottom:4px}
.ok p{margin:0;color:var(--ink-2)}
.note{font-size:13px;color:var(--ink-2);margin:0}

footer{border-top:1px solid var(--line);padding:28px 0 40px;color:var(--ink-2);font-size:14px}
footer .wrap{display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between}

/* modal */
.scrim{position:fixed;inset:0;background:rgba(23,48,46,.55);z-index:2000;display:none;align-items:flex-start;justify-content:center;padding:32px 16px;overflow:auto}
.scrim.open{display:flex}
.modal{background:var(--paper);width:min(880px,100%);border-radius:20px;overflow:hidden;box-shadow:0 20px 60px rgba(23,48,46,.35)}
.m-head{position:relative;background:var(--c);color:#fff;padding:28px 28px 24px;display:grid;grid-template-columns:120px 1fr;gap:22px;align-items:center}
.m-photo{width:120px;height:120px;border-radius:16px;background:rgba(255,255,255,.16);display:grid;place-items:center;border:1px solid rgba(255,255,255,.35)}
.m-head h2{font-size:clamp(26px,3.4vw,38px);line-height:1.05}
.m-head p{margin:6px 0 0;opacity:.92}
.close{position:absolute;right:14px;top:14px;width:40px;height:40px;border-radius:50%;border:0;background:rgba(255,255,255,.2);color:#fff;cursor:pointer;display:grid;place-items:center}
.close:hover{background:rgba(255,255,255,.32)}
.m-body{padding:24px 28px 28px;display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:28px}
.m-body h3{font-size:19px;margin:0 0 10px}
.m-body p.story{margin:0 0 22px;font-size:17px}
.prods{list-style:none;padding:0;margin:0;display:grid;gap:8px}
.prods li{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:grid;grid-template-columns:40px 1fr;gap:12px;align-items:center}
.prods .pi{width:40px;height:40px;border-radius:8px;background:var(--c);opacity:.9;display:grid;place-items:center;color:#fff}
.prods small{display:block;color:var(--ink-2)}
dl.factsheet{margin:0;display:grid;gap:12px}
dl.factsheet dt{font-size:13px;font-weight:700;color:var(--ink-2)}
dl.factsheet dd{margin:2px 0 0}
.m-actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px}
.m-form{grid-column:1/-1}

@media (max-width:1100px){
  .toolbar .search{grid-column:1/-1}
  .toolbar{grid-template-columns:1fr 1fr}
  .pavs{grid-template-columns:repeat(2,minmax(0,1fr))}
}
@media (max-width:860px){
  .wrap{padding:0 16px}
  .top nav{display:none}
  .lang{margin-left:auto}
  .hero{padding:32px 0 20px}
  .hero .wrap{grid-template-columns:1fr;gap:18px}
  .explore-grid,.explore-grid:not(.has-list){grid-template-columns:minmax(0,1fr);grid-template-areas:"map" "pav" "list"}
  .mapcol{position:relative;top:0}
  .pavs{gap:10px}
  .pav{padding:14px;min-height:150px}
  .pav[aria-pressed="true"]{padding:13px}
  #map{height:58vh;min-height:360px}
  .toolbar{grid-template-columns:1fr;padding:12px}
  .toolbar .opt{display:none}
  .toolbar.show .opt{display:block}
  .toolbar.show .certs.opt{display:flex}
  .filters-toggle{display:inline-flex}
  .row-mobile{display:flex;gap:10px;align-items:center}
  .steps,.exhibit,.two{grid-template-columns:1fr}
  .m-head{grid-template-columns:72px 1fr;padding:22px 18px 18px;gap:14px}
  .m-photo{width:72px;height:72px}
  .m-body{grid-template-columns:1fr;padding:20px 18px 24px}
  .scrim{padding:0}
  .modal{border-radius:0;min-height:100%}
  .legend{display:none}
}
@media (min-width:861px){.row-mobile{display:none}}
section[id]{scroll-margin-top:72px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <a class="brand" href="#top" aria-label="Vetrina Italia">
      <svg width="30" height="30" viewBox="0 0 30 30" aria-hidden="true"><rect x="1" y="1" width="28" height="28" rx="8" fill="#1E5B47"/><path d="M8 9l7 13 7-13" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg>
      Vetrina Italia
    </a>
    <nav aria-label="Principale">
      <a href="#esplora" data-i18n="nav.explore"></a>
      <a href="#padiglioni" data-i18n="nav.pavilions"></a>
      <a href="#come-funziona" data-i18n="nav.how"></a>
      <a href="#esponi" data-i18n="nav.exhibit"></a>
    </nav>
    <div class="lang" role="group" aria-label="Lingua / Language">
      <button type="button" data-lang="it" aria-pressed="true">IT</button>
      <button type="button" data-lang="en" aria-pressed="false">EN</button>
      <button type="button" data-lang="de" aria-pressed="false">DE</button>
    </div>
  </div>
</header>

<main id="top">
  <section class="hero">
    <div class="wrap">
      <h1 data-i18n="hero.title"></h1>
      <div>
        <p class="lead" data-i18n="hero.lead"></p>
        <div class="cta">
          <a class="btn primary" href="#esplora" data-i18n="hero.cta1"></a>
          <a class="btn ghost" href="#esponi" data-i18n="hero.cta2"></a>
        </div>
        <p class="facts" id="facts"></p>
      </div>
    </div>
  </section>

  <section class="explore" id="esplora" aria-labelledby="explore-title">
    <div class="wrap">
      <h2 id="explore-title" class="sr" data-i18n="nav.explore"></h2>
      <div class="toolbar" id="toolbar">
        <div class="field search">
          <label for="q" data-i18n="f.search"></label>
          <svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="2"/><path d="M20 20l-4-4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          <input id="q" type="search" autocomplete="off">
        </div>
        <div class="row-mobile">
          <button type="button" class="btn ghost small filters-toggle" id="ftoggle" aria-expanded="false" aria-controls="toolbar"></button>
          <p class="count" id="count-m" aria-hidden="true"></p>
        </div>
        <div class="field opt"><label for="f-cat" data-i18n="f.cat"></label><select id="f-cat"></select></div>
        <div class="field opt"><label for="f-reg" data-i18n="f.reg"></label><select id="f-reg"></select></div>
        <div class="field opt"><label for="f-exp" data-i18n="f.exp"></label><select id="f-exp"></select></div>
        <div class="field opt"><label for="f-moq" data-i18n="f.moq"></label><select id="f-moq"></select></div>
        <div class="certs opt" role="group" aria-labelledby="cert-lbl">
          <span class="lbl" id="cert-lbl" data-i18n="f.certs"></span>
          <span id="cert-chips"></span>
          <button type="button" class="reset" id="reset" data-i18n="f.reset"></button>
          <p class="count" id="count" aria-live="polite"></p>
        </div>
      </div>
      <div class="explore-grid">
        <div class="pavwrap" id="padiglioni">
          <h2 class="pavh" id="pav-title" data-i18n="pav.title"></h2>
          <div class="pavs" id="pavs" role="group" aria-labelledby="pav-title"></div>
        </div>
        <div class="list" id="list"></div>
        <div class="mapcol">
          <div id="map" role="region" aria-label="Mappa degli espositori"></div>
          <div class="legend" id="legend" aria-hidden="true"></div>
        </div>
      </div>
    </div>
  </section>


  <section class="block" id="come-funziona" aria-labelledby="how-title">
    <div class="wrap">
      <h2 id="how-title" data-i18n="how.title"></h2>
      <p class="intro" data-i18n="how.intro"></p>
      <ol class="steps">
        <li><h3 data-i18n="how.s1t"></h3><p data-i18n="how.s1"></p></li>
        <li><h3 data-i18n="how.s2t"></h3><p data-i18n="how.s2"></p></li>
        <li><h3 data-i18n="how.s3t"></h3><p data-i18n="how.s3"></p></li>
      </ol>
    </div>
  </section>

  <section class="block" id="esponi" aria-labelledby="ex-title">
    <div class="wrap exhibit">
      <div>
        <h2 id="ex-title" data-i18n="ex.title"></h2>
        <p class="intro" data-i18n="ex.intro"></p>
        <ul class="benefits">
          <li><svg width="26" height="26" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12l5 5L20 6" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg><div><strong data-i18n="ex.b1t"></strong><span data-i18n="ex.b1"></span></div></li>
          <li><svg width="26" height="26" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12l5 5L20 6" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg><div><strong data-i18n="ex.b2t"></strong><span data-i18n="ex.b2"></span></div></li>
          <li><svg width="26" height="26" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12l5 5L20 6" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg><div><strong data-i18n="ex.b3t"></strong><span data-i18n="ex.b3"></span></div></li>
        </ul>
      </div>
      <div id="ex-slot">
        <form class="card" id="ex-form" novalidate>
          <h3 data-i18n="ex.formt"></h3>
          <div class="two">
            <div class="field"><label for="e-co" data-i18n="ex.co"></label><input id="e-co" required><p class="err" data-i18n="err.req"></p></div>
            <div class="field"><label for="e-name" data-i18n="ex.name"></label><input id="e-name" required><p class="err" data-i18n="err.req"></p></div>
          </div>
          <div class="field"><label for="e-mail" data-i18n="ex.mail"></label><input id="e-mail" type="email" required><p class="err" data-i18n="err.mail"></p></div>
          <div class="two">
            <div class="field"><label for="e-reg" data-i18n="f.reg"></label><select id="e-reg" required></select><p class="err" data-i18n="err.req"></p></div>
            <div class="field"><label for="e-cat" data-i18n="f.cat"></label><select id="e-cat" required></select><p class="err" data-i18n="err.req"></p></div>
          </div>
          <div class="field"><label for="e-exp" data-i18n="ex.exp"></label><input id="e-exp"></div>
          <button class="btn primary" type="submit" data-i18n="ex.send"></button>
          <p class="note" data-i18n="ex.note"></p>
        </form>
      </div>
    </div>
  </section>
</main>

<footer>
  <div class="wrap">
    <span data-i18n="foot.demo"></span>
    <span>Vetrina Italia, 2026</span>
  </div>
</footer>

<div class="scrim" id="scrim" aria-hidden="true">
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="m-title" id="modal"></div>
</div>

let lang = "it";
try{ const s = localStorage.getItem("vi-lang"); if(s==="en"||s==="it"||s==="de") lang=s; }catch(e){}
const t = (k,...a) => { const v = T[lang][k]; return typeof v === "function" ? v(...a) : v; };
const regLabel = r => r.split("/")[0];
const catName = k => CATS[k][lang];
const esc = s => String(s).replace(/[&<>"]/g, ch => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[ch]));

const state = {q:"",cat:"",reg:"",exp:"",moq:"",certs:new Set()};

/* ---------- map ---------- */
const map = L.map("map",{zoomSnap:0.25,minZoom:5,maxZoom:11,attributionControl:false,scrollWheelZoom:false,maxBounds:[[34.5,4.5],[48.5,20.5]]});
const itBounds = L.latLngBounds([[36.4,6.6],[47.1,18.6]]);
map.fitBounds(itBounds,{padding:[10,10]});
map.on("focus",()=>map.scrollWheelZoom.enable());
map.on("blur",()=>map.scrollWheelZoom.disable());

const regionStyle = f => ({color:"#9FB3AC",weight:1,fillColor: state.reg && f.properties.reg_name===state.reg ? "#CFE3D8" : "#FBFCF9",fillOpacity:1});
const regionLayer = L.geoJSON(REGIONS,{
  style:regionStyle,
  onEachFeature:(f,layer)=>{
    layer.bindTooltip(regLabel(f.properties.reg_name),{sticky:true,className:"region-tip",direction:"top"});
    layer.on("click",()=>{ state.reg = state.reg===f.properties.reg_name ? "" : f.properties.reg_name; document.getElementById("f-reg").value=state.reg; apply(); });
  }
}).addTo(map);

const cluster = L.markerClusterGroup({showCoverageOnHover:false,maxClusterRadius:38,spiderfyOnMaxZoom:true,
  iconCreateFunction:c=>L.divIcon({html:`<div class="cluster">${c.getChildCount()}</div>`,className:"",iconSize:[40,40]})});
map.addLayer(cluster);
const markers = {};
let activeId = null;

function pinIcon(e,on){
  return L.divIcon({className:"",iconSize:[30,30],iconAnchor:[4,30],popupAnchor:[11,-28],
    html:`<div class="pin${on?" on":""}" style="--c:${CATS[e.cat].c}"><b>${CATS[e.cat].l}</b></div>`});
}
function popupHtml(e){
  return `<div class="pop"><h3>${esc(e.n)}</h3><p>${catName(e.cat)}, ${esc(e.city)}</p><button class="btn primary small" type="button" data-open="${e.id}">${t("visit")}</button></div>`;
}
EX.forEach(e=>{
  const m = L.marker([e.lat,e.lng],{icon:pinIcon(e,false),title:e.n,keyboard:true});
  m.bindPopup(()=>popupHtml(e),{closeButton:true});
  m.on("popupopen",()=>setActive(e.id,false));
  markers[e.id]=m;
});
document.addEventListener("click",ev=>{ const b = ev.target.closest("[data-open]"); if(b){ openStand(b.dataset.open); } });

function setActive(id,fly){
  if(activeId && markers[activeId]) markers[activeId].setIcon(pinIcon(EX.find(x=>x.id===activeId),false));
  activeId = id;
  const e = EX.find(x=>x.id===id); if(!e) return;
  markers[id].setIcon(pinIcon(e,true));
  document.querySelectorAll(".stand").forEach(s=>s.classList.toggle("active",s.dataset.id===id));
  if(fly){ cluster.zoomToShowLayer(markers[id],()=>markers[id].openPopup()); }
}

/* ---------- filters ---------- */
function filtered(){
  const q = state.q.trim().toLowerCase();
  return EX.filter(e=>{
    if(state.cat && e.cat!==state.cat) return false;
    if(state.reg && e.reg!==state.reg) return false;
    if(state.exp && !e.exp.includes(state.exp)) return false;
    if(state.moq && e.moq>Number(state.moq)) return false;
    for(const c of state.certs){ if(!e.certs.includes(c)) return false; }
    if(q){
      const hay = [e.n,e.city,regLabel(e.reg),CATS[e.cat].it,CATS[e.cat].en,e.d.it,e.d.en,D_DE[e.id],CATS[e.cat].de,...e.p.map(p=>p[0])].join(" ").toLowerCase();
      if(!hay.includes(q)) return false;
    }
    return true;
  });
}
function activeFilters(){ return [state.cat,state.reg,state.exp,state.moq].filter(Boolean).length + state.certs.size; }

function apply(){
  const list = filtered();
  const grid = document.querySelector(".explore-grid");
  const had = grid.classList.contains("has-list");
  grid.classList.toggle("has-list", !!state.cat);
  if(had !== !!state.cat) map.invalidateSize({pan:false});
  cluster.clearLayers();
  cluster.addLayers(list.map(e=>markers[e.id]));
  regionLayer.setStyle(regionStyle);
  if(list.length){
    const b = L.latLngBounds(list.map(e=>[e.lat,e.lng]));
    if(state.reg || state.cat || state.q || state.exp || state.certs.size || state.moq) map.flyToBounds(list.length===1?b.pad(2):b.pad(0.25),{maxZoom:8,duration:.6});
    else map.flyToBounds(itBounds,{duration:.6});
  }
  renderList(list);
  document.querySelectorAll("[data-pav]").forEach(b=>b.setAttribute("aria-pressed",state.cat===b.dataset.pav));
  document.getElementById("count").innerHTML = t("count",list.length);
  document.getElementById("count-m").innerHTML = t("count",list.length);
  document.getElementById("ftoggle").textContent = t("f.toggle",activeFilters());
}

function renderList(list){
  const el = document.getElementById("list");
  if(!list.length){ el.innerHTML = `<div class="empty"><h3>${t("empty.t")}</h3><p>${t("empty.p")}</p><button class="btn ghost small" type="button" id="empty-reset">${t("f.reset")}</button></div>`;
    document.getElementById("empty-reset").onclick = resetAll; return; }
  el.innerHTML = list.map(e=>`
    <button type="button" class="stand${e.id===activeId?" active":""}" data-id="${e.id}" style="--c:${CATS[e.cat].c}">
      <span class="thumb">${icon(e.cat,30)}</span>
      <span>
        <h3>${esc(e.n)}</h3>
        <span class="meta">${t("stand.code",e.id,(lang==="de"?catName(e.cat):catName(e.cat).toLowerCase()))}<br>${esc(e.city)}, ${esc(regLabel(e.reg))}</span>
        <span class="tags">${e.certs.map(c=>`<span class="tag cert">${c}</span>`).join("")}${e.exp.map(c=>`<span class="tag">${c}</span>`).join("")}</span>
      </span>
    </button>`).join("");
  el.querySelectorAll(".stand").forEach(b=>{
    b.addEventListener("click",()=>openStand(b.dataset.id));
    b.addEventListener("mouseenter",()=>{ if(window.matchMedia("(min-width:861px)").matches) setActive(b.dataset.id,false); });
  });
}

function fillSelects(){
  const regs = [...new Set(EX.map(e=>e.reg))].sort((a,b)=>regLabel(a).localeCompare(regLabel(b)));
  const allRegs = REGIONS.features.map(f=>f.properties.reg_name).sort((a,b)=>regLabel(a).localeCompare(regLabel(b)));
  const opt = (v,l,sel)=>`<option value="${esc(v)}"${sel?" selected":""}>${esc(l)}</option>`;
  document.getElementById("f-cat").innerHTML = opt("",t("f.all"))+Object.keys(CATS).map(k=>opt(k,catName(k),state.cat===k)).join("");
  document.getElementById("f-reg").innerHTML = opt("",t("f.allR"))+regs.map(r=>opt(r,regLabel(r),state.reg===r)).join("");
  const cs = Object.keys(COUNTRIES).sort((a,b)=>COUNTRIES[a][lang].localeCompare(COUNTRIES[b][lang]));
  document.getElementById("f-exp").innerHTML = opt("",t("f.allC"))+cs.map(c=>opt(c,COUNTRIES[c][lang],state.exp===c)).join("");
  document.getElementById("f-moq").innerHTML = ["","10","25","50"].map(v=>opt(v,t(v?"moq."+v:"moq.any"),state.moq===v)).join("");
  document.getElementById("cert-chips").innerHTML = CERTS.map(c=>`<button type="button" class="chip" data-cert="${c}" aria-pressed="${state.certs.has(c)}">${c}</button>`).join(" ");
  document.querySelectorAll("[data-cert]").forEach(b=>b.onclick=()=>{ const c=b.dataset.cert; state.certs.has(c)?state.certs.delete(c):state.certs.add(c); b.setAttribute("aria-pressed",state.certs.has(c)); apply(); });
  const eReg = document.getElementById("e-reg"), eCat = document.getElementById("e-cat");
  if(eReg){ const v1=eReg.value, v2=eCat.value;
    eReg.innerHTML = opt("",t("sel"))+allRegs.map(r=>opt(r,regLabel(r),v1===r)).join("");
    eCat.innerHTML = opt("",t("sel"))+Object.keys(CATS).map(k=>opt(k,catName(k),v2===k)).join(""); }
}

function resetAll(){
  state.q="";state.cat="";state.reg="";state.exp="";state.moq="";state.certs.clear();
  document.getElementById("q").value=""; fillSelects(); apply();
}

document.getElementById("q").addEventListener("input",e=>{ state.q=e.target.value; apply(); });
["cat","reg","exp","moq"].forEach(k=>document.getElementById("f-"+k).addEventListener("change",e=>{ state[k]=e.target.value; apply(); }));
document.getElementById("reset").onclick = resetAll;
document.getElementById("ftoggle").onclick = ()=>{ const tb=document.getElementById("toolbar"); const on=tb.classList.toggle("show"); document.getElementById("ftoggle").setAttribute("aria-expanded",on); };

/* ---------- pavilions ---------- */
function scrollToMap(){
  requestAnimationFrame(()=>{
    const el = document.querySelector(".mapcol");
    const prev = el.style.position; el.style.position = "static";
    const y = el.getBoundingClientRect().top + window.scrollY - 76;
    el.style.position = prev;
    const smooth = !window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    window.scrollTo({top:y, behavior: smooth ? "smooth" : "auto"});
  });
}
function renderPavs(){
  document.getElementById("pavs").innerHTML = Object.keys(CATS).map(k=>{
    const ex = EX.filter(e=>e.cat===k);
    const regs = [...new Set(ex.map(e=>regLabel(e.reg)))];
    return `<button type="button" class="pav" data-pav="${k}" style="--c:${CATS[k].c}" aria-pressed="${state.cat===k}" title="${esc(t("pav.regs")+" "+regs.join(", "))}">
      <span class="ico">${icon(k,28)}</span><span class="n" aria-hidden="true">${ex.length}</span>
      <h3>${catName(k)}</h3><p>${t("pav.n",ex.length)}. ${t("pav.regs")} ${regs.join(", ")}.</p></button>`;
  }).join("");
  document.querySelectorAll("[data-pav]").forEach(b=>b.onclick=()=>{
    state.cat = state.cat===b.dataset.pav ? "" : b.dataset.pav;
    fillSelects(); apply(); scrollToMap();
  });
}
function renderLegend(){
  document.getElementById("legend").innerHTML = Object.keys(CATS).map(k=>`<span style="--c:${CATS[k].c}"><i></i>${catName(k)}</span>`).join("");
}

/* ---------- stand modal ---------- */
const scrim = document.getElementById("scrim"), modal = document.getElementById("modal");
let lastFocus = null, openId = null;
function openStand(id,mode){
  const e = EX.find(x=>x.id===id); if(!e) return;
  if(!scrim.classList.contains("open")) lastFocus = document.activeElement;
  openId = id; setActive(id,false);
  const c = CATS[e.cat].c;
  modal.style.setProperty("--c",c);
  modal.innerHTML = `
    <div class="m-head">
      <div class="m-photo" role="img" aria-label="${t("m.photo")}">${icon(e.cat,56)}</div>
      <div><h2 id="m-title">${esc(e.n)}</h2><p>${t("stand.code",e.id,(lang==="de"?catName(e.cat):catName(e.cat).toLowerCase()))}. ${esc(e.city)}, ${esc(regLabel(e.reg))}, ${t("since",e.y)}.</p></div>
      <button class="close" type="button" aria-label="${t("m.close")}" id="m-close"><svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg></button>
    </div>
    <div class="m-body">
      <div>
        <h3>${t("m.story")}</h3>
        <p class="story">${esc(lang==="de"?D_DE[e.id]:e.d[lang])}</p>
        <h3>${t("m.products")}</h3>
        <ul class="prods">${e.p.map(p=>`<li><span class="pi">${icon(e.cat,22)}</span><span><strong>${esc(p[0])}</strong><small>${esc(fmtP(p[1]))}</small></span></li>`).join("")}</ul>
      </div>
      <div>
        <dl class="factsheet">
          <div><dt>${t("m.certs")}</dt><dd>${e.certs.length?e.certs.join(", "):t("m.none")}</dd></div>
          <div><dt>${t("m.exp")}</dt><dd>${e.exp.map(x=>COUNTRIES[x][lang]).join(", ")}</dd></div>
          <div><dt>${t("m.langs")}</dt><dd>${e.lg.map(x=>LANGS[x][lang]).join(", ")}</dd></div>
          <div><dt>${t("m.moq")}</dt><dd>${t("m.moqv",e.moq)}</dd></div>
          <div><dt>${t("m.where")}</dt><dd>${esc(e.city)}, ${esc(regLabel(e.reg))}</dd></div>
        </dl>
        <div class="m-actions">
          <button class="btn primary" type="button" data-req="c">${t("m.contact")}</button>
          <button class="btn ghost" type="button" data-req="s">${t("m.samples")}</button>
        </div>
      </div>
      <div class="m-form" id="m-form"></div>
    </div>`;
  scrim.classList.add("open"); scrim.setAttribute("aria-hidden","false"); document.body.style.overflow="hidden";
  document.getElementById("m-close").onclick = closeStand;
  modal.querySelectorAll("[data-req]").forEach(b=>b.onclick=()=>reqForm(e,b.dataset.req));
  if(mode) reqForm(e,mode); else document.getElementById("m-close").focus();
}
function reqForm(e,kind){
  const slot = document.getElementById("m-form");
  const cs = Object.keys(COUNTRIES).sort((a,b)=>COUNTRIES[a][lang].localeCompare(COUNTRIES[b][lang]));
  slot.innerHTML = `<form class="card" id="r-form" novalidate>
    <h3>${kind==="s"?t("r.titleS",esc(e.n)):t("r.titleC",esc(e.n))}</h3>
    <div class="two">
      <div class="field"><label for="r-name">${t("r.name")}</label><input id="r-name" required><p class="err">${t("err.req")}</p></div>
      <div class="field"><label for="r-co">${t("r.co")}</label><input id="r-co" required><p class="err">${t("err.req")}</p></div>
    </div>
    <div class="two">
      <div class="field"><label for="r-type">${t("r.type")}</label><select id="r-type" required><option value="">${t("sel")}</option>${t("r.types").map(x=>`<option>${x}</option>`).join("")}</select><p class="err">${t("err.req")}</p></div>
      <div class="field"><label for="r-country">${t("r.country")}</label><select id="r-country" required><option value="">${t("sel")}</option>${cs.map(c=>`<option value="${c}">${COUNTRIES[c][lang]}</option>`).join("")}</select><p class="err">${t("err.req")}</p></div>
    </div>
    <div class="field"><label for="r-mail">${t("ex.mail")}</label><input id="r-mail" type="email" required><p class="err">${t("err.mail")}</p></div>
    <div class="field"><label for="r-msg">${t("r.msg")}</label><textarea id="r-msg" placeholder="${t("r.ph")}"></textarea></div>
    <button class="btn primary" type="submit">${t("r.send")}</button>
    <p class="note"></p>
  </form>`;
  const f = document.getElementById("r-form");
  f.querySelector(".note").textContent = {en:"Demo: your request is stored only in this browser and is not sent to anyone.",de:"Demo: Ihre Anfrage wird nur in diesem Browser gespeichert und an niemanden gesendet.",it:"Demo: la richiesta resta salvata solo in questo browser e non viene inviata a nessuno."}[lang];
  document.getElementById("r-name").focus();
  slot.scrollIntoView({block:"nearest"});
  f.addEventListener("submit",ev=>{
    ev.preventDefault();
    if(!validate(f)) return;
    const rec = {stand:e.id,kind,name:f["r-name"].value,company:f["r-co"].value,type:f["r-type"].value,country:f["r-country"].value,email:f["r-mail"].value,msg:f["r-msg"].value,at:new Date().toISOString()};
    try{ const a = JSON.parse(localStorage.getItem("vi-requests")||"[]"); a.push(rec); localStorage.setItem("vi-requests",JSON.stringify(a)); }catch(err){}
    slot.innerHTML = `<div class="ok" role="status" tabindex="-1" id="r-ok"><h3>${t("r.ok.t")}</h3><p>${t("r.ok",esc(e.n))}</p></div>`;
    document.getElementById("r-ok").focus();
  });
}
function validate(f){
  let ok = true, first = null;
  f.querySelectorAll("[required]").forEach(inp=>{
    const fld = inp.closest(".field");
    const bad = !inp.value.trim() || (inp.type==="email" && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(inp.value));
    fld.classList.toggle("bad",bad); inp.setAttribute("aria-invalid",bad);
    if(bad){ ok=false; if(!first) first=inp; }
  });
  if(first) first.focus();
  return ok;
}
function closeStand(){
  scrim.classList.remove("open"); scrim.setAttribute("aria-hidden","true"); document.body.style.overflow=""; openId=null;
  if(lastFocus && lastFocus.focus) lastFocus.focus();
}
scrim.addEventListener("click",e=>{ if(e.target===scrim) closeStand(); });
document.addEventListener("keydown",e=>{
  if(!scrim.classList.contains("open")) return;
  if(e.key==="Escape") closeStand();
  if(e.key==="Tab"){
    const f = [...modal.querySelectorAll("button,input,select,textarea,[tabindex]")].filter(x=>!x.disabled && x.offsetParent!==null);
    if(!f.length) return;
    if(e.shiftKey && document.activeElement===f[0]){ e.preventDefault(); f[f.length-1].focus(); }
    else if(!e.shiftKey && document.activeElement===f[f.length-1]){ e.preventDefault(); f[0].focus(); }
  }
});

/* ---------- exhibitor form ---------- */
function bindExForm(){
  const f = document.getElementById("ex-form");
  f.addEventListener("submit",ev=>{
    ev.preventDefault();
    if(!validate(f)) return;
    const co = f["e-co"].value.trim();
    try{ const a = JSON.parse(localStorage.getItem("vi-applications")||"[]"); a.push({company:co,name:f["e-name"].value,email:f["e-mail"].value,region:f["e-reg"].value,cat:f["e-cat"].value,exp:f["e-exp"].value,at:new Date().toISOString()}); localStorage.setItem("vi-applications",JSON.stringify(a)); }catch(err){}
    const slot = document.getElementById("ex-slot");
    slot.dataset.done = co;
    renderExDone();
  });
}
function renderExDone(){
  const slot = document.getElementById("ex-slot");
  slot.innerHTML = `<div class="ok" role="status" tabindex="-1" id="ex-ok"><h3>${t("ex.ok.t")}</h3><p>${t("ex.ok",esc(slot.dataset.done))}</p><p style="margin-top:12px"><button class="btn ghost small" type="button" id="ex-again">${t("ex.again")}</button></p></div>`;
  document.getElementById("ex-again").onclick = ()=>location.reload();
  document.getElementById("ex-ok").focus();
}

/* ---------- i18n ---------- */
function renderText(){
  document.documentElement.lang = lang;
  document.querySelectorAll("[data-i18n]").forEach(el=>{ el.textContent = t(el.dataset.i18n); });
  document.querySelectorAll(".lang button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.lang===lang));
  const regs = new Set(EX.map(e=>e.reg)).size, cs = new Set(EX.flatMap(e=>e.exp)).size;
  document.getElementById("facts").innerHTML = t("facts",EX.length,regs,cs);
  document.getElementById("map").setAttribute("aria-label", {it:"Mappa degli espositori",en:"Exhibitor map",de:"Karte der Aussteller"}[lang]);
  fillSelects(); renderPavs(); renderLegend(); apply();
  if(openId) openStand(openId);
  const slot = document.getElementById("ex-slot"); if(slot.dataset.done) renderExDone();
}
document.querySelectorAll(".lang button").forEach(b=>b.onclick=()=>{ lang=b.dataset.lang; try{localStorage.setItem("vi-lang",lang);}catch(e){} renderText(); });

bindExForm();
renderText();
</script>
</body>
